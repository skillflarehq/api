info:
  name: Get Interview
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/interviews/{{interview_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns one interview, including `interview_status`, `user_full_name`, `user_email`, `user_meta` (opaque partner metadata from create-user `meta`, or `{}`), `recording_started_at`, and `latest_evaluation_set`.

  `DROPPED_OUT` means the user clicked "I am ready" and did not start recording within 30 minutes. The container sandbox is destroyed. `recording_started_at` and `latest_evaluation_set` stay null, and no interview webhook fires.

  An interview in another organization is `404`.
