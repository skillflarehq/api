info:
  name: List Interviews
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/interviews"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists interviews for the active organization.

  Each item includes `interview_status`, `user_full_name`, `user_email`, and `user_meta` (opaque partner metadata from create-user `meta`, or `{}`). `PENDING` means the user has not started. `DROPPED_OUT` means they clicked "I am ready" and did not start recording within 30 minutes. `EXPIRED` means a `PENDING` interview passed `expires_at`.

  Poll until `COMPLETED`, `FAILED`, `DROPPED_OUT`, or `EXPIRED`. `DROPPED_OUT` and `EXPIRED` do not include an evaluation.
