info:
  name: List Candidates
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/candidates"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists candidates for the active organization as `{ data, meta }`. The envelope `meta` is pagination only (`limit`, `offset`, `count`).

  Each item includes `id`, `created_at`, `full_name`, `email`, and its own `meta` object for partner metadata (defaults to `{}`). That item `meta` is unrelated to the pagination envelope.
