info:
  name: Get User
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/users/{{user_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns one user: `id`, `created_at`, `full_name`, `email`, and `meta`.

  `meta` is the opaque JSON object stored on the organization–user link (defaults to `{}`). A user linked to another organization is `404`.
