info:
  name: Users
  type: folder
  seq: 2

docs: |-
  Users are people linked to your organization. Each user resource includes `meta`: opaque partner JSON on the organization–user link (defaults to `{}`).

  Set `meta` on create; list and get echo it back. PATCH can update `email`, `full_name`, and/or `meta` (replace). Invite `email` / `full_name` apply only while the user is still an unlinked stub; after signup, only `meta` can change. Webhooks include `user_full_name`, `user_email`, and the same `meta` value as `user_meta` on `data.interview`. A re-create (`200`) does not overwrite existing `meta`.
