info:
  name: List Organizations
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/organizations"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
