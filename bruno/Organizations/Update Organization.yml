info:
  name: Update Organization
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{url}}/organizations/{{organization_id}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Northwind Studio"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
