info:
  name: Get Environment
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/environments/{{environment_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns one environment: `id`, `created_at`, `name`, `operating_system`, `description`, and `tools`.

  `id` must be a UUID. Unknown or deleted environments are `404`.
