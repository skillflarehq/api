info:
  name: List Environments
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/environments"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lists environments as `{ data, meta }` with pagination (`limit`, `offset`, `count`).

  Each item includes `id`, `created_at`, `name`, `operating_system`, `oci_url`, `description`, and `tools` (`id`, `tool_id`, `name`). Copy an `id` into `environment_id` for Get Environment.
