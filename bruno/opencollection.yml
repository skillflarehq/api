opencollection: 1.0.0

info:
  name: Skillflare
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: x-api-key
      value: "{{api_key}}"
    - name: x-organization-id
      value: "{{organization_id}}"
      disabled: true
    - name: Content-Type
      value: application/json
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
      - .env*
