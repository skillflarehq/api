info:
  name: Create Session
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/sessions"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "candidate_id": "{{candidate_id}}",
        "challenge_id": "{{challenge_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
