info:
  name: List Sessions
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/sessions"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists sessions for the active organization.

  Each item includes `session_status`. `PENDING` means the candidate has not started. `DROPPED_OUT` means they clicked "I am ready" and did not start recording within 30 minutes. `EXPIRED` means a `PENDING` session passed `expires_at`.

  Poll until `COMPLETED`, `FAILED`, `DROPPED_OUT`, or `EXPIRED`. `DROPPED_OUT` and `EXPIRED` do not include an evaluation.
