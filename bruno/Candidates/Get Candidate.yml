info:
  name: Get Candidate
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/candidates/{{candidate_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns one candidate: `id`, `created_at`, `full_name`, `email`, and `meta`.

  `meta` is the opaque JSON object stored on the organization–candidate link (defaults to `{}`). A candidate linked to another organization is `404`.
