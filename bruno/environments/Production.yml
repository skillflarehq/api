name: Production
variables:
  - name: base_url
    value: https://api.skillflare.co
  - name: url
    value: https://api.skillflare.co/v1
  - name: candidate_id
    value: 7b8735e7-3e8d-45f9-94e6-afd63ba9e46f
  - name: session_id
    value: b56b535a-3c7f-4861-b84b-77ccdb8ebd0d
  - name: challenge_id
    value: 7e222889-a0b6-44c0-87e2-f9c1b928389f
  - name: environment_id
    value: ""
    description: UUID for Get Environment. Copy from List Environments.
  - name: expires_at
    value: 2026-11-25T19:45:00.000Z
    description: Optional ISO 8601 lobby deadline for Create Session. Leave empty for a link that does not expire. A value that is not an ISO 8601 timestamp, or a time that is not in the future, is rejected.
  - name: organization_id
    value: 73e9322e-3a79-405b-a9d5-52237eef8165
    description: Value of the x-organization-id header. Leave empty, and leave the header disabled, to use the organization that owns the API key. Also the path id for Update Organization.
  - secret: true
    name: api_key
    description: Organization API key (sk_skillflare_...). Enter it in Bruno’s Secrets tab; Bruno stores it encrypted on this machine and does not write it here.
